#VRML_SIM R2025a utf8

# Smart AI Lawn Mower
# Front  = caster wheel side (-X)
# Rear   = two drive wheels side (+X)
#
# Sensors:
# 3 front distance sensors
# 1 rear distance sensor
# 2 wheel encoders
# 1 IMU
# 1 GPS
# 1 Camera
#
# All sensors are invisible.
# Existing body and physics structure preserved.

PROTO LawnMower [
  field SFVec3f    translation  0 0 0.10
  field SFRotation rotation     0 0 1 0
  field SFString   name         "LawnMower"
  field SFFloat    bodyMass     1
  field SFString   controller   "<none>"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller

    children [

      # =========================================================
      # MAIN BODY
      # =========================================================

      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor 0.20 0.60 0.20
          roughness 1
          metalness 0
        }

        geometry Box {
          size 0.50 0.40 0.12
        }
      }


      # =========================================================
      # REAR RIGHT DRIVE WHEEL
      # =========================================================

      DEF WHEEL1 HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.22 0.22 0
        }

        device [
          RotationalMotor {
            name "wheel1"
          }

          PositionSensor {
            name "encoder1"
          }
        ]

        endPoint Solid {
          translation 0.22 0.22 0
          rotation 1 0 0 1.5708

          children [
            DEF WHEEL Shape {
              appearance PBRAppearance {
                baseColor 0.10 0.10 0.10
                roughness 1
                metalness 0
              }

              geometry Cylinder {
                height 0.05
                radius 0.10
                subdivision 24
              }
            }
          ]

          boundingObject USE WHEEL

          physics Physics {
          }
        }
      }


      # =========================================================
      # REAR LEFT DRIVE WHEEL
      # =========================================================

      DEF WHEEL2 HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.22 -0.22 0
        }

        device [
          RotationalMotor {
            name "wheel2"
          }

          PositionSensor {
            name "encoder2"
          }
        ]

        endPoint Solid {
          translation 0.22 -0.22 0
          rotation 1 0 0 1.5708

          children [
            USE WHEEL
          ]

          name "rear_left_wheel"

          boundingObject USE WHEEL

          physics Physics {
          }
        }
      }


      # =========================================================
      # FRONT CASTER WHEEL
      # =========================================================

      DEF CASTER_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.25 0 -0.04
        }

        endPoint Solid {
          translation -0.25 0 -0.04
          rotation 1 0 0 1.5708

          children [
            DEF CASTER_SHAPE Shape {
              appearance PBRAppearance {
                baseColor 0.30 0.30 0.30
                roughness 1
                metalness 0
              }

              geometry Cylinder {
                height 0.04
                radius 0.06
                subdivision 24
              }
            }
          ]

          name "front_caster"

          boundingObject USE CASTER_SHAPE

          physics Physics {
          }
        }
      }


      # =========================================================
      # FRONT CENTER DISTANCE SENSOR
      # =========================================================
      #
      # Front = -X
      # Sensor points straight toward -X.
      #
      # No Shape -> invisible.
      #

      DEF DS_FRONT DistanceSensor {
        translation -0.27 0 0.06

        rotation 0 0 1 3.14159

        name "ds_front"
      }


      # =========================================================
      # FRONT LEFT DISTANCE SENSOR
      # =========================================================
      #
      # Front-left:
      # -X direction
      # +Y side
      #
      # No Shape -> invisible.
      #

      DEF DS_FRONT_LEFT DistanceSensor {
        translation -0.24 0.13 0.06

        rotation 0 0 1 2.79159

        name "ds_front_left"
      }


      # =========================================================
      # FRONT RIGHT DISTANCE SENSOR
      # =========================================================
      #
      # Front-right:
      # -X direction
      # -Y side
      #
      # No Shape -> invisible.
      #

      DEF DS_FRONT_RIGHT DistanceSensor {
        translation -0.24 -0.13 0.06

        rotation 0 0 1 -2.79159

        name "ds_front_right"
      }


      # =========================================================
      # REAR DISTANCE SENSOR
      # =========================================================
      #
      # Rear = drive wheel side (+X)
      #
      # No Shape -> invisible.
      #

      DEF DS_REAR DistanceSensor {
        translation 0.27 0 0.06

        rotation 0 0 1 0

        name "ds_rear"
      }


      # =========================================================
      # CAMERA
      # =========================================================
      #
      # Camera points toward the actual FRONT (-X).
      # No visible Shape -> invisible.
      #

      DEF CAMERA Camera {
        translation -0.18 0 0.13

        rotation 0 1 0 1.5708

        fieldOfView 1.0472
        width 640
        height 480
        near 0.01

        name "camera"
      }


      # =========================================================
      # GPS
      # =========================================================
      #
      # Located near the robot center.
      # GPS has no visible geometry.
      #

      DEF GPS_SENSOR GPS {
        translation 0 0 0.16

        name "gps"
      }


      # =========================================================
      # IMU
      # =========================================================
      #
      # Located near the robot center.
      # IMU has no visible geometry.
      #

      DEF IMU_SENSOR InertialUnit {
        translation 0 0 0.15

        name "imu"
      }

    ]


    # =========================================================
    # MAIN BODY COLLISION
    # =========================================================

    boundingObject USE BODY


    # =========================================================
    # ROBOT PHYSICS
    # =========================================================

    physics Physics {
      density -1
      mass IS bodyMass
    }
  }
}